# Barreiras de CI — docs/14-barreiras-ci.md
#
# Nada vai para produção sem o job "portao-producao" verde.
#   - Proteção da branch main: exigir o status "portao-producao" (configurar no GitHub).
#   - Todo workflow de deploy deve ter `needs: portao-producao` (ou rodar estas barreiras antes).
#
# Actions fixadas por SHA de commit (tag mutável pode ser sequestrada).
# Versões escolhidas com ≥ 2 semanas de publicação, conferidas em 2026-11-13.

name: barreiras

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Diário: uma versão aprovada ontem pode ganhar CVE hoje.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barreiras-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Barreira 1 — pacotes inventados pela IA / dependências não revisadas.
  # Roda SEM instalar nada: um pacote inventado nunca chega a ser baixado.
  # ---------------------------------------------------------------------------
  dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Dependências existem, estão aprovadas e são confiáveis
        run: node scripts/ci/check-deps.mjs
      - name: Lockfile só com o registro oficial e hash de integridade
        run: node scripts/ci/check-lockfile.mjs

  # ---------------------------------------------------------------------------
  # Barreira 2a — segredos no repositório e variáveis NEXT_PUBLIC_.
  # ---------------------------------------------------------------------------
  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Instalar gitleaks (binário com checksum verificado)
        env:
          GITLEAKS_VERSAO: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          arq="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          curl -fsSLo "$arq" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/${arq}"
          echo "${GITLEAKS_SHA256}  ${arq}" | sha256sum -c -
          tar -xzf "$arq" gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Segredos em todo o histórico do git
        run: gitleaks git --redact --verbose --exit-code 1 .
      - name: Variáveis NEXT_PUBLIC_ aprovadas e sem nome de segredo
        run: node scripts/ci/check-env-publicas.mjs

  # ---------------------------------------------------------------------------
  # Barreira 3a — vulnerabilidade conhecida no Next.js / React (tolerância zero).
  # ---------------------------------------------------------------------------
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Next.js/React sem vulnerabilidade conhecida (OSV)
        run: node scripts/ci/check-framework-vulns.mjs

  # ---------------------------------------------------------------------------
  # Barreiras 2b + 3b — só depois das dependências aprovadas: instala, audita,
  # confere a superfície de servidor e faz o build com segredos-canário.
  # ---------------------------------------------------------------------------
  build:
    needs: [dependencias]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (lê packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Instalar exatamente o lockfile (scripts de install bloqueados pelo pnpm)
        run: pnpm install --frozen-lockfile
      - name: Auditoria de vulnerabilidades (todas as dependências, alta ou crítica)
        run: pnpm audit --audit-level high
      - name: Superfície de servidor do Next.js (somente leitura, DEC-12)
        run: node scripts/ci/check-superficie-servidor.mjs apps/web
      - name: Gerar valores-canário para os segredos de servidor
        run: node scripts/ci/gerar-canarios.mjs >> "$GITHUB_ENV"
      - name: Build do app com os canários
        if: hashFiles('apps/web/package.json') != ''
        run: pnpm --filter ./apps/web build
      - name: Nenhum segredo no que vai para o navegador
        if: hashFiles('apps/web/package.json') != ''
        run: node scripts/ci/check-bundle-segredos.mjs apps/web
      - name: Typecheck de todos os pacotes (depois do build, que gera os tipos do Next)
        run: pnpm typecheck
      - name: Testes (node:test, sem banco nem rede)
        run: pnpm test

  # ---------------------------------------------------------------------------
  # Portão único: o status exigido pela proteção de branch e pelo deploy.
  # ---------------------------------------------------------------------------
  portao-producao:
    needs: [dependencias, segredos, framework, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Todas as barreiras passaram
        env:
          RESULTADOS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Resultados: $RESULTADOS"
          if echo "$RESULTADOS" | grep -qvE '^\s*(\[|\]|"success",?)\s*$'; then
            echo "::error::Alguma barreira não passou. Nada vai para produção."
            exit 1
          fi
